<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Random Reddit Search</title>
    <style>
        /* Zen, calming background */
        body {
            font-family: system-ui, -apple-system, Roboto, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh; /* Dynamic viewport height for mobile */
            margin: 0;
            background: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%);
            color: #1a1a1b;
            padding: 20px;
            box-sizing: border-box;
            /* Prevent text selection for a more app-like feel */
            -webkit-user-select: none; 
            user-select: none;
        }

        /* Soft, clean card design */
        .container {
            padding: 32px 24px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 28px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            max-width: 400px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: fadeIn 0.6s ease-out;
        }

        /* Smooth entrance animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 1.6rem;
            margin-top: 0;
            margin-bottom: 12px;
            color: #004d40;
            font-weight: 700;
        }

        p {
            color: #546e7a;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        /* Android-friendly, large touch target */
        button {
            background-color: #00897b; /* Calming teal */
            color: white;
            border: none;
            padding: 18px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 137, 123, 0.3);
            -webkit-tap-highlight-color: transparent;
        }

        /* Tactile press effect for mobile */
        button:active {
            transform: scale(0.96);
            background-color: #00695c;
            box-shadow: 0 2px 8px rgba(0, 137, 123, 0.4);
        }

        /* Disabled state while redirecting */
        button:disabled {
            background-color: #80cbc4;
            transform: none;
            box-shadow: none;
            cursor: wait;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Random Reddit</h1>
    <p>Tap below to search Google for a random subreddit, or a random corner of Reddit.</p>
    <button id="randomBtn">Surprise Me</button>
</div>

<script>
    const subreddits = [
        "aww", "technology", "gaming", "funny", "science",
        "worldnews", "todayilearned", "movies", "music", "books",
        "food", "travel", "art", "DIY", "personalfinance",
        "AskReddit", "explainlikeimfive", "LifeProTips", "dataisbeautiful",
        "space", "history", "philosophy", "photography", "woodworking",
        "cooking", "gardening", "fitness", "running", "cycling"
    ];

    const btn = document.getElementById('randomBtn');

    function goToRandomReddit() {
        // 1. Change button text to give immediate feedback on mobile
        btn.innerText = "Searching...";
        btn.disabled = true;

        // 2. The 33% Logic
        // Math.random() gives a number between 0 and 1. 
        // If it's less than 0.33, it's a 33% chance.
        const isGeneralReddit = Math.random() < 0.33; 

        let searchQuery = "";

        if (isGeneralReddit) {
            // 33% of the time: Search all of Reddit
            searchQuery = "site:reddit.com";
        } else {
            // 67% of the time: Pick a random subreddit
            const randomIndex = Math.floor(Math.random() * subreddits.length);
            const randomSub = subreddits[randomIndex];
            searchQuery = `site:reddit.com/r/${randomSub}`;
        }

        // 3. Build the Google search URL
        const googleSearchUrl = `https://www.google.com/search?q=${encodeURIComponent(searchQuery)}`;

        // 4. Tiny delay so the user sees the button press animation before redirect
        setTimeout(() => {
            window.location.href = googleSearchUrl;
        }, 150);
    }

    // Add a click listener to the button
    btn.addEventListener('click', goToRandomReddit);
</script>

</body>
</html>
